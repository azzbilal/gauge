<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gauge warehouse dashboard</title>
<!-- Static and dependency-free: no CDN, no framework. Data comes from snapshot.js, written by
     snapshot.py (python warehouse/dashboard/snapshot.py). Open this file directly. -->
<style>
  :root {
    --bg-deep: #0d1a0d; --bg-card: #162216; --bg-dark: #0a0f0a;
    --accent: #D5FF40; --border: rgba(213,255,64,0.15); --border-mid: rgba(213,255,64,0.30);
    --text-body: #c8d4c8; --text-muted: #6a7a6a; --text-dark: #0a0f0a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg-deep); color: var(--text-body);
    font-family: 'Poppins', 'Segoe UI', system-ui, sans-serif;
    font-size: 14px; line-height: 1.65; padding: 60px 40px;
  }
  .wrapper { max-width: 1200px; margin: 0 auto; }
  h1, h2 { color: var(--accent); line-height: 1.1; }
  h1 { font-size: clamp(32px, 5vw, 52px); font-weight: 700; letter-spacing: -0.03em; margin-bottom: 16px; }
  h2 { font-size: 22px; font-weight: 600; display: flex; gap: 16px; align-items: baseline; }
  .num { color: var(--accent); font-size: 16px; font-weight: 600; }
  .eyebrow { font-size: 11px; text-transform: uppercase; letter-spacing: 0.15em; color: var(--text-muted); margin-bottom: 12px; }
  .meta { color: var(--text-muted); font-size: 12px; }
  .meta b { color: var(--text-body); font-weight: 600; }
  .divider { border: none; border-top: 1px solid var(--border); margin: 40px 0; }
  section { margin-top: 8px; }
  .lede { margin: 8px 0 20px; max-width: 820px; }
  .table-wrap { overflow-x: auto; scrollbar-color: var(--border-mid) var(--bg-dark); border: 1px solid var(--border-mid); border-radius: 12px; background: var(--bg-card); }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { padding: 10px 14px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  th { white-space: normal; min-width: 72px; vertical-align: bottom; text-align: right; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-muted); background: var(--bg-dark); }
  td { text-align: right; font-variant-numeric: tabular-nums; }
  th:first-child, td:first-child { text-align: left; }
  td:first-child { color: var(--accent); font-weight: 600; }
  tr:last-child td { border-bottom: none; }
  .null { color: var(--text-muted); }
  .id { display: block; color: var(--text-muted); font-size: 11px; font-weight: 400; font-family: Consolas, monospace; }
  .flag { background: var(--accent); color: var(--text-dark); border-radius: 20px; padding: 1px 10px; font-weight: 600; }
  .defs { margin-top: 14px; font-size: 12px; color: var(--text-muted); }
  .defs dt { display: inline; color: var(--text-body); font-weight: 600; }
  .defs dd { display: inline; margin: 0; }
  .defs dd::after { content: ""; display: block; margin-bottom: 4px; }
  .notice { margin: 0 0 16px; padding: 14px 18px; border: 1px solid var(--border-mid); border-radius: 12px; background: var(--bg-dark); font-size: 13px; }
  .notice b { color: var(--accent); }
  .error { color: #ffb4a8; }
  @media (max-width: 700px) { body { padding: 36px 20px; } }
</style>
</head>
<body>
<div class="wrapper">
  <div class="eyebrow">Gauge · warehouse · DuckDB + dbt</div>
  <h1>Campaign {quality}</h1>
  <p class="meta" id="meta">Loading snapshot…</p>
  <hr class="divider">
  <div id="content"></div>
</div>

<script src="snapshot.js"></script>
<script>
(function () {
  "use strict";

  // Columns shown as percentages, and columns with two decimals.
  var PERCENT = /(_rate|_share|^share_|accuracy|agreement)/;
  var DECIMAL2 = /^(avg_|tasks_per_day)/;

  var SECTIONS = {
    mart_campaign: {
      lede: "One row per campaign. Gold (calibration) tasks are excluded from every metric and counted separately.",
      defs: {
        accept_rate: "accepted / (accepted + rejected); — when nothing is decided.",
        tasks_per_day: "task count / calendar days from first to last task, inclusive.",
        reviewer_agreement: "share of tasks with two or more identified reviews whose verdicts all match; — when no task has two."
      }
    },
    mart_task_quality: {
      lede: "One row per rubric criterion, over every review (legacy included) of a decided, non-gold task. Scores are 0–5.",
      defs: {
        acceptance_min: "the bar a task must meet on this criterion to be accepted.",
        avg_score_accepted: "mean score on reviews of tasks that ended ACCEPTED (avg_score_rejected likewise).",
        share_with_evidence: "scores that came with a non-blank evidence note / all scores."
      }
    },
    mart_reviewer_calibration: {
      lede: "One row per identified reviewer. Verdicts on gold tasks are compared with each gold's known answer; never with final task status.",
      defs: {
        gold_accuracy: "gold reviews matching the known answer / gold reviews.",
        false_accept_rate: "gold-reject items the reviewer accepted / gold-reject items reviewed.",
        false_reject_rate: "gold-accept items the reviewer rejected / gold-accept items reviewed.",
        flagged_for_recalibration: "at least 5 gold reviews and accuracy below 0.8."
      }
    }
  };

  function el(tag, cls, text) {
    var node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  function label(col) { return col.replace(/^n_/, "# ").replace(/_/g, " "); }

  function cell(col, value) {
    var td = el("td");
    if (value === null || value === undefined) {
      td.appendChild(el("span", "null", "—")).title = "null: no data to compute this from";
    } else if (typeof value === "boolean") {
      if (value) td.appendChild(el("span", "flag", "yes")); else td.textContent = "no";
    } else if (typeof value === "number" && PERCENT.test(col)) {
      td.textContent = (value * 100).toFixed(1) + "%";
    } else if (typeof value === "number" && DECIMAL2.test(col)) {
      td.textContent = value.toFixed(2);
    } else {
      td.textContent = String(value);
    }
    return td;
  }

  function renderTable(mart) {
    // The expert id rides under the reviewer's name (two experts can share a name).
    var idCol = mart.columns.indexOf("reviewer_expert_id");
    var shown = mart.columns.filter(function (c) { return c !== "reviewer_expert_id"; });
    var table = el("table");
    var head = table.createTHead().insertRow();
    shown.forEach(function (c) { head.appendChild(el("th", null, label(c))); });
    var body = table.createTBody();
    mart.rows.forEach(function (row) {
      var tr = body.insertRow();
      mart.columns.forEach(function (c, i) {
        if (i === idCol) return;
        var td = cell(c, row[i]);
        if (i === 0 && idCol >= 0) td.appendChild(el("span", "id", "…" + String(row[idCol]).slice(-8)));
        tr.appendChild(td);
      });
    });
    var wrap = el("div", "table-wrap");
    wrap.appendChild(table);
    return wrap;
  }

  function notices(name, mart) {
    var out = [];
    if (mart.rows.length === 0) out.push("No rows yet.");
    if (name === "mart_reviewer_calibration" && mart.rows.length) {
      var gi = mart.columns.indexOf("n_gold_reviews");
      var anyGold = mart.rows.some(function (r) { return r[gi] > 0; });
      if (!anyGold) out.push("No reviewer has reviewed a gold task yet, so every gold rate is — (unmeasured, not zero).");
    }
    return out;
  }

  function render(snap) {
    var meta = document.getElementById("meta");
    meta.textContent = "";
    [["Raw data loaded", snap.loaded_at], ["snapshot written", snap.generated_at], ["from", snap.database]]
      .forEach(function (pair, i) {
        if (i) meta.appendChild(document.createTextNode(" · "));
        meta.appendChild(document.createTextNode(pair[0] + " "));
        meta.appendChild(el("b", null, String(pair[1])));
      });

    var content = document.getElementById("content");
    var i = 0;
    Object.keys(SECTIONS).forEach(function (name) {
      var mart = snap.marts[name];
      if (!mart) return;
      i += 1;
      var sec = el("section");
      var h2 = el("h2");
      h2.appendChild(el("span", "num", (i < 10 ? "0" : "") + i));
      h2.appendChild(document.createTextNode(mart.title));
      sec.appendChild(h2);
      sec.appendChild(el("p", "lede", SECTIONS[name].lede + " Source: " + name + "."));
      notices(name, mart).forEach(function (text) {
        var box = el("p", "notice");
        box.appendChild(el("b", null, "Note: "));
        box.appendChild(document.createTextNode(text));
        sec.appendChild(box);
      });
      sec.appendChild(renderTable(mart));
      var dl = el("dl", "defs");
      Object.keys(SECTIONS[name].defs).forEach(function (k) {
        dl.appendChild(el("dt", null, label(k) + ": "));
        dl.appendChild(el("dd", null, SECTIONS[name].defs[k]));
      });
      sec.appendChild(dl);
      content.appendChild(sec);
      content.appendChild(el("hr", "divider"));
    });
  }

  function fail(msg) {
    var meta = document.getElementById("meta");
    meta.textContent = msg;
    meta.className = "meta error";
  }

  if (window.GAUGE_SNAPSHOT) {
    render(window.GAUGE_SNAPSHOT);
  } else if (location.protocol !== "file:") {
    fetch("snapshot.json")
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(render)
      .catch(function () { fail("No snapshot found. Run: python warehouse/dashboard/snapshot.py"); });
  } else {
    fail("No snapshot found. Run: python warehouse/dashboard/snapshot.py");
  }
})();
</script>
</body>
</html>
