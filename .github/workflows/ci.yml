name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Prisma generate reads this during typecheck/build; it does not connect.
      DATABASE_URL: postgresql://gauge:gauge@localhost:5432/gauge
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/*/package-lock.json

      - name: Install web dependencies
        run: npm ci
        working-directory: apps/web

      - name: Install API dependencies
        run: npm ci
        working-directory: apps/api

      - name: Typecheck
        run: npm run typecheck

      - name: Test API
        run: npm test

      - name: Build web
        run: npm run build:web

      - name: Build API
        run: npm run build:api

  verify-python:
    # The verify service is standard library only. This job uses the runner's own Python
    # and installs nothing: without cadquery the geometry tests skip, the rest must pass.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show interpreter
        run: |
          python3 --version
          python3 -c "import importlib.util as u; print('cadquery:', 'present' if u.find_spec('cadquery') else 'absent (geometry tests skip)')"

      - name: Test verify/lint
        run: python3 -m unittest discover -s verify/lint/tests -v

      - name: Test verify/verifiers
        run: python3 -m unittest discover -s verify/verifiers/tests -v

      - name: Test verify/probe
        run: python3 -m unittest discover -s verify/probe/tests -v

      - name: Test model (cad-spec, generator, benchmark)
        run: python3 -m unittest discover -s model/tests -v
