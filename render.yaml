# Gauge on Render (Blueprint). Steps and caveats: docs/DEPLOY.md.
# The live backend (gauge-api, gauge-verify, gauge-db) runs on Render with this layout.
#
#   gauge-api     Docker web service; the image entrypoint runs prisma migrate deploy on start
#   gauge-verify  Docker web service on port 4000 (no cadquery: cannot run submitted CAD code)
#   gauge-db      Render Postgres
# The web app is deployed to Vercel separately and rewrites /api/* to gauge-api's public URL.
services:
  - type: web
    name: gauge-api
    runtime: docker
    # Plans are explicit: an omitted plan defaults to 0.5c-512mb (paid).
    plan: free
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: ./apps/api
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: gauge-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 12h
      # Render's proxy is in front of the API: trust one hop so req.ip (login/register rate
      # limit) is the connecting address, assuming Render adds a single X-Forwarded-For hop
      # (not checked on the live service). Web users arrive through the Vercel rewrite, so
      # they likely share buckets per Vercel egress IP: one caller can use up the 10/min for
      # the others. 2 would reach the user but let direct callers of the onrender.com URL
      # forge their IP.
      - key: TRUST_PROXY
        value: "1"
      # Render has no Ollama, so the intake agent uses Anthropic. ANTHROPIC_MODEL is left to
      # the code default; add it in the dashboard to override.
      - key: LLM_PROVIDER
        value: anthropic
      - key: ANTHROPIC_API_KEY
        sync: false
      # Entered by hand, WITH the scheme: https://gauge-verify.onrender.com.
      - key: VERIFY_SERVICE_URL
        sync: false
      # Shared secret with gauge-verify, sent as "Authorization: Bearer ...". Enter the SAME
      # value on both services by hand (generateValue would make two different secrets).
      - key: VERIFY_SERVICE_TOKEN
        sync: false
      # Used only by the one-off seed (required with NODE_ENV=production).
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: SEED_REVIEWER_PASSWORD
        sync: false
      - key: SLACK_WEBHOOK_URL
        sync: false
    # PORT is set by Render; the API listens on it.

  - type: web
    name: gauge-verify
    runtime: docker
    # Free plan: the API reaches verify on its PUBLIC https URL, not the internal address
    # (free services cannot receive private-network traffic). Cold starts are possible.
    plan: free
    dockerfilePath: ./verify/Dockerfile
    dockerContext: ./verify
    healthCheckPath: /health
    envVars:
      # The service always listens on 4000; this tells Render which port to route.
      - key: PORT
        value: "4000"
      # The verify URL is public; with this set, every POST needs the token (GET /health
      # stays open for the health check). Same value as on gauge-api.
      - key: VERIFY_SERVICE_TOKEN
        sync: false

databases:
  - name: gauge-db
    databaseName: gauge
    user: gauge
    plan: free
