# Gauge on Render (Blueprint). Steps and caveats: docs/DEPLOY.md.
# Not deployed from this repo yet; the file is checked only for YAML shape.
#
#   gauge-api     Docker web service; the image entrypoint runs prisma migrate deploy on start
#   gauge-verify  Docker web service on port 4000 (no cadquery: cannot run submitted CAD code)
#   gauge-db      Render Postgres
# The web app is deployed to Vercel separately and rewrites /api/* to gauge-api's public URL.
services:
  - type: web
    name: gauge-api
    runtime: docker
    # Plans are explicit: an omitted plan defaults to 0.5c-512mb (paid).
    plan: free
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: ./apps/api
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: gauge-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 12h
      # Render has no Ollama, so the intake agent uses Anthropic. ANTHROPIC_MODEL is left to
      # the code default; add it in the dashboard to override.
      - key: LLM_PROVIDER
        value: anthropic
      - key: ANTHROPIC_API_KEY
        sync: false
      # Entered by hand, WITH the scheme: https://gauge-verify.onrender.com.
      - key: VERIFY_SERVICE_URL
        sync: false
      # Used only by the one-off seed (required with NODE_ENV=production).
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: SEED_REVIEWER_PASSWORD
        sync: false
      - key: SLACK_WEBHOOK_URL
        sync: false
    # PORT is set by Render; the API listens on it.

  - type: web
    name: gauge-verify
    runtime: docker
    # Free plan: the API reaches verify on its PUBLIC https URL, not the internal address
    # (free services cannot receive private-network traffic). Cold starts are possible.
    plan: free
    dockerfilePath: ./verify/Dockerfile
    dockerContext: ./verify
    healthCheckPath: /health
    envVars:
      # The service always listens on 4000; this tells Render which port to route.
      - key: PORT
        value: "4000"

databases:
  - name: gauge-db
    databaseName: gauge
    user: gauge
    plan: free
